# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    paths:
      - 'hw5/backtester/**'
      - 'hw5/tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'hw5/backtester/**'
      - 'hw5/tests/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: coverage run -m pytest -q
      - run: coverage report --fail-under=90